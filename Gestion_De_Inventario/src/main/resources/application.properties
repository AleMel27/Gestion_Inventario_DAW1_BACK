spring.application.name=gestion-inventario

# ==========================================
# MYSQL
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/gestion_inventario
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# HIKARICP - CONNECTION POOL
# ==========================================

# Asegurar que Spring use Hikari
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

spring.datasource.hikari.pool-name=InventarioPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=3000

# ==========================================
# LOGGING PARA VERIFICAR HIKARI
# ==========================================
logging.level.com.zaxxer.hikari.HikariConfig=INFO
logging.level.com.zaxxer.hikari=INFO

# ==========================================
# JWT
# ==========================================
jwt.secret=${JWT_SECRET:}
jwt.expiration=3600000
